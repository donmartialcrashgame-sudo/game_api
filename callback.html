const PROD='https://game-api.online',LOCAL='http://127.0.0.1:5500';const $=id=>document.getElementById(id);function fail(t){$('loader').style.display='none';$('status').textContent='Authentication could not be completed.';$('msg').textContent=t;$('msg').className='msg show'}
