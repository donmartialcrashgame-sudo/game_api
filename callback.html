<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gaming API — Authentication</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #f4f6f8;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #111827;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      margin: 0;

      font-size: 30px;

      letter-spacing: 1px;
    }

    .brand p {
      margin-top: 8px;

      color: #6b7280;
    }

    .card {
      background: #ffffff;

      border-radius: 14px;

      padding: 30px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    .loader {
      width: 45px;
      height: 45px;

      border: 4px solid #e5e7eb;

      border-top-color: #2563eb;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

      margin: 0 auto 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h2 {
      margin-top: 0;
    }

    .status {
      color: #6b7280;

      font-size: 14px;

      line-height: 1.6;
    }

    .message {
      display: none;

      margin-top: 20px;

      padding: 13px;

      border-radius: 8px;

      background: #f3f4f6;

      color: #374151;

      font-size: 14px;

      line-height: 1.5;

      white-space: pre-line;
    }

    .error {
      background: #fef2f2;

      color: #991b1b;
    }

    .success {
      background: #ecfdf5;

      color: #065f46;
    }

    .mfa-card {
      display: none;
    }

    .mfa-description {
      color: #6b7280;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 20px;
    }

    .mfa-code {
      width: 100%;

      padding: 14px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      font-size: 24px;

      text-align: center;

      letter-spacing: 8px;

      outline: none;

      margin-bottom: 12px;
    }

    .mfa-code:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;

      padding: 13px;

      border: 0;

      border-radius: 8px;

      background: #2563eb;

      color: white;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    .back {
      margin-top: 15px;

      display: block;

      color: #2563eb;

      text-decoration: none;

      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- BRAND -->

  <div class="brand">

    <h1>
      GAMING API
    </h1>

    <p>
      Secure authentication
    </p>

  </div>


  <!-- CALLBACK PROCESSING CARD -->

  <div
    class="card"
    id="processingCard">

    <div class="loader"></div>

    <h2>
      Completing sign in
    </h2>

    <p
      class="status"
      id="status">

      Verifying your authentication...

    </p>

    <div
      id="message"
      class="message">
    </div>

  </div>


  <!-- MFA CARD -->

  <div
    class="card mfa-card"
    id="mfaCard">

    <h2>
      Two-Factor Authentication
    </h2>

    <p class="mfa-description">

      Your account requires two-factor
      authentication.

      <br><br>

      Open your authenticator app and
      enter the six-digit code.

    </p>


    <input
      id="mfaCode"
      class="mfa-code"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="000000"
    >


    <button
      id="verifyMfa">

      Verify 2FA

    </button>


    <div
      id="mfaMessage"
      class="message">
    </div>


    <a
      href="login.html"
      class="back">

      Return to login

    </a>

  </div>

</div>


<script type="module">

  /*
   * ==========================================
   * SUPABASE
   * ==========================================
   */

  import {
    createClient
  } from
  "https://esm.sh/@supabase/supabase-js@2";


  const SUPABASE_URL =
    "https://qbagxeqquskkjksoraiz.supabase.co";


  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiYWd4ZXFxdXNra2prc29yYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0.CpvwORFZrDtM5TVzqUlkHyc39E4jofCebQ16Ne-wShk";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /*
   * ==========================================
   * STATE
   * ==========================================
   */

  let mfaFactorId = null;

  let mfaChallengeId = null;


  /*
   * ==========================================
   * ELEMENTS
   * ==========================================
   */

  const processingCard =
    document.getElementById(
      "processingCard"
    );


  const mfaCard =
    document.getElementById(
      "mfaCard"
    );


  const status =
    document.getElementById(
      "status"
    );


  const message =
    document.getElementById(
      "message"
    );


  const mfaMessage =
    document.getElementById(
      "mfaMessage"
    );


  const mfaCode =
    document.getElementById(
      "mfaCode"
    );


  const verifyMfa =
    document.getElementById(
      "verifyMfa"
    );


  /*
   * ==========================================
   * MESSAGE FUNCTIONS
   * ==========================================
   */

  function showMessage(
    text,
    type = ""
  ) {

    message.style.display =
      "block";

    message.className =
      "message " + type;

    message.textContent =
      text;

  }


  function showMfaMessage(
    text,
    type = ""
  ) {

    mfaMessage.style.display =
      "block";

    mfaMessage.className =
      "message " + type;

    mfaMessage.textContent =
      text;

  }


  /*
   * ==========================================
   * ERROR HANDLER
   * ==========================================
   */

  function showError(
    text
  ) {

    status.textContent =
      "Authentication could not be completed.";

    showMessage(
      text,
      "error"
    );

    document
      .querySelector(".loader")
      .style.display =
      "none";

  }


  /*
   * ==========================================
   * GET OAUTH ERROR
   * ==========================================
   */

  function checkOAuthError() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const hash =
      new URLSearchParams(
        window.location.hash
          .replace("#", "")
      );


    const error =
      params.get("error") ||
      hash.get("error");


    const errorDescription =
      params.get(
        "error_description"
      ) ||
      hash.get(
        "error_description"
      );


    if (error) {

      showError(

        errorDescription ||
        error

      );

      return true;

    }


    return false;

  }


  /*
   * ==========================================
   * GET SESSION
   * ==========================================
   */

  async function getSession() {

    status.textContent =
      "Retrieving your secure session...";


    const {
      data,
      error
    } =
    await supabase.auth
      .getSession();


    if (error) {

      showError(
        error.message
      );

      return null;

    }


    if (!data.session) {

      showError(
        "No authentication session was found. Please return to the login page and try again."
      );

      return null;

    }


    return data.session;

  }


  /*
   * ==========================================
   * CHECK AUTHENTICATION LEVEL
   * ==========================================
   */

  async function checkAuthenticationLevel() {

    status.textContent =
      "Checking account security...";


    const {
      data,
      error
    } =
    await supabase.auth
      .mfa
      .getAuthenticatorAssuranceLevel();


    if (error) {

      showError(
        error.message
      );

      return false;

    }


    /*
     * Already AAL2
     */

    if (
      data.currentLevel ===
      "aal2"
    ) {

      return true;

    }


    /*
     * User has MFA configured
     * but needs to complete it.
     */

    if (
      data.nextLevel === "aal2" &&
      data.currentLevel !== "aal2"
    ) {

      return await startMfa();

    }


    /*
     * No MFA requirement.
     */

    return true;

  }


  /*
   * ==========================================
   * START MFA
   * ==========================================
   */

  async function startMfa() {

    status.textContent =
      "Preparing two-factor authentication...";


    const {
      data,
      error
    } =
    await supabase.auth
      .mfa
      .listFactors();


    if (error) {

      showError(
        error.message
      );

      return false;

    }


    const verifiedFactors =
      data.totp.filter(
        factor =>
          factor.status ===
          "verified"
      );


    if (
      verifiedFactors.length === 0
    ) {

      /*
       * There is no verified
       * TOTP factor.
       *
       * Do not pretend MFA was
       * completed.
       */

      showError(
        "Your account requires additional authentication, but no verified authenticator factor was found."
      );

      return false;

    }


    /*
     * Use the first verified factor
     * for now.
     */

    const factor =
      verifiedFactors[0];


    mfaFactorId =
      factor.id;


    /*
     * Create challenge.
     */

    const {
      data: challenge,
      error:
        challengeError
    } =
    await supabase.auth
      .mfa
      .challenge({

        factorId:
          factor.id

      });


    if (challengeError) {

      showError(
        challengeError.message
      );

      return false;

    }


    mfaChallengeId =
      challenge.id;


    /*
     * Switch from callback
     * processing to MFA screen.
     */

    processingCard.style.display =
      "none";


    mfaCard.style.display =
      "block";


    mfaCode.focus();


    showMfaMessage(
      "Enter the six-digit code from your authenticator app."
    );


    return false;

  }


  /*
   * ==========================================
   * VERIFY MFA
   * ==========================================
   */

  verifyMfa.addEventListener(
    "click",
    async () => {

      const code =
        mfaCode.value.trim();


      if (
        !/^\d{6}$/.test(code)
      ) {

        showMfaMessage(
          "Enter a valid 6-digit authenticator code.",
          "error"
        );

        return;

      }


      if (
        !mfaFactorId ||
        !mfaChallengeId
      ) {

        showMfaMessage(
          "The MFA challenge is no longer available. Please sign in again.",
          "error"
        );

        return;

      }


      verifyMfa.disabled =
        true;


      showMfaMessage(
        "Verifying your authenticator code..."
      );


      const {
        error
      } =
      await supabase.auth
        .mfa
        .verify({

          factorId:
            mfaFactorId,

          challengeId:
            mfaChallengeId,

          code:
            code

        });


      if (error) {

        verifyMfa.disabled =
          false;

        showMfaMessage(
          error.message,
          "error"
        );

        return;

      }


      /*
       * Confirm the session actually
       * reached AAL2.
       */

      const {
        data:
          assurance,
        error:
          assuranceError
      } =
      await supabase.auth
        .mfa
        .getAuthenticatorAssuranceLevel();


      if (assuranceError) {

        verifyMfa.disabled =
          false;

        showMfaMessage(
          assuranceError.message,
          "error"
        );

        return;

      }


      if (
        assurance.currentLevel !==
        "aal2"
      ) {

        verifyMfa.disabled =
          false;

        showMfaMessage(
          "The authenticator was not accepted as an AAL2 session.",
          "error"
        );

        return;

      }


      showMfaMessage(
        "Two-factor authentication verified successfully.",
        "success"
      );


      /*
       * Redirect after successful MFA.
       */

      setTimeout(
        () => {

          window.location.href =
            "dashboard.html";

        },
        700
      );

    }
  );


  /*
   * ==========================================
   * MAIN CALLBACK
   * ==========================================
   */

  async function processCallback() {

    /*
     * First check whether OAuth
     * returned an error.
     */

    if (
      checkOAuthError()
    ) {

      return;

    }


    /*
     * Supabase JS normally detects
     * the OAuth session from the
     * callback URL automatically.
     */

    const session =
      await getSession();


    if (!session) {

      return;

    }


    status.textContent =
      "Authentication successful. Checking security...";


    /*
     * Give Supabase a moment to
     * finish processing the auth
     * event before checking MFA.
     */

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          150
        )
    );


    const authenticated =
      await checkAuthenticationLevel();


    /*
     * If MFA is required,
     * startMfa() has already displayed
     * the MFA screen.
     */

    if (!authenticated) {

      return;

    }


    /*
     * Everything is complete.
     */

    status.textContent =
      "Authentication complete.";


    showMessage(
      "You have been securely authenticated. Redirecting...",
      "success"
    );


    setTimeout(
      () => {

        window.location.href =
          "dashboard.html";

      },
      700
    );

  }


  /*
   * ==========================================
   * AUTH STATE LISTENER
   * ==========================================
   *
   * This helps when Supabase finishes
   * processing the OAuth callback
   * asynchronously.
   */

  let callbackProcessed =
    false;


  supabase.auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        if (
          callbackProcessed
        ) {

          return;

        }


        if (
          event ===
          "SIGNED_IN" &&
          session
        ) {

          callbackProcessed =
            true;


          await processCallback();

        }

      }
    );


  /*
   * ==========================================
   * START
   * ==========================================
   */

  processCallback();

</script>

</body>
</html>
