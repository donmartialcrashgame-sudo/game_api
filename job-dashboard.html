<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>Game API — Job Dashboard</title><style>:root{--bg:#060912;--card:#0c1320;--line:#ffffff12;--text:#f8fafc;--muted:#91a0b5;--blue:#4f8cff;--good:#20c997;--warn:#f2b84b;--bad:#ff5c6c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#4f8cff15,transparent 35%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.nav{height:66px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#0a101cf2}.brand{font-weight:900}.btn{padding:10px 14px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff08;color:#fff;cursor:pointer;text-decoration:none;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:30px 20px}.hero{padding:30px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#0d1625,#101a2b);margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:1.4px;color:#75a7ff;font-weight:900}.hero h1{margin:8px 0}.muted{color:var(--muted);font-size:14px;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.label{color:var(--muted);font-size:11px;text-transform:uppercase}.value{font-size:18px;font-weight:900;margin-top:8px;word-break:break-word}.status{margin-top:18px;padding:22px;border-radius:16px;border:1px solid var(--line);background:#0c1320}.approved{border-color:#20c99755;background:#0b241b}.pending{border-color:#f2b84b55;background:#251d0d}.declined{border-color:#ff5c6c55;background:#2a1118}.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.primary{background:#2563eb;border-color:#2563eb}.logout{background:#182438}.small{font-size:12px}.spinner{opacity:.7}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav{padding:0 15px}.hero{padding:24px}}</style></head><body><header class="nav"><div class="brand">Game API</div><button class="btn logout" id="logout">Sign out</button></header><main class="wrap"><section class="hero"><span class="eyebrow">EMPLOYEE DASHBOARD</span><h1 id="title">Loading your account…</h1><p class="muted" id="subtitle">Checking your secure Game API account status.</p></section><section id="content"><div class="status"><span class="spinner">Loading account details…</span></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.105.0';const supabase=createClient('https://qbagxeqquskkjksoraiz.supabase.co','sb_publishable_chfRxHSFPSA1SZJtBajtKA_I7vs8R--');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const pretty=s=>String(s||'—').replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase());async function init(){const{data,error}=await supabase.auth.getUser();if(error||!data.user){location.replace('/login.html');return}const user=data.user;const{data:account,error:ae}=await supabase.from('job_accounts').select('user_id,application_code,full_name,email,phone,job_title,account_status,exam_status,account_created_at,account_reviewed_at,created_at,updated_at').eq('user_id',user.id).maybeSingle();if(ae){$('content').innerHTML='<div class="status declined"><h2>Unable to load account</h2><p class="muted">'+esc(ae.message)+'</p></div>';return}if(!account){$('title').textContent='Account not found';$('subtitle').textContent='Your authenticated account is not linked to a Game API job account yet.';$('content').innerHTML='<div class="status pending"><h2>Account setup incomplete</h2><p class="muted">Please return to your application review page and complete the account registration process.</p><div class="actions"><a class="btn primary" href="https://pages-game-api-online.onrender.com/job/review.html">Application Review</a></div></div>';return}$('title').textContent='Welcome, '+account.full_name;$('subtitle').textContent=account.job_title||'Game API Team Member';let cls='pending',heading='Account Under Review',text='Your Game API account is waiting for account approval. You cannot start the required exam or work yet.';if(account.account_status==='approved'){cls='approved';heading='✓ Account Approved';text='Your Game API account has been approved. Complete the required exam before you can start working.'}else if(account.account_status==='declined'){cls='declined';heading='Account Declined';text='Your Game API account was declined. Please contact Game API support for the next step.'}let examBlock='';if(account.account_status==='approved'){examBlock='<div class="card"><div class="label">Exam Status</div><div class="value">'+esc(pretty(account.exam_status))+'</div></div>'}$('content').innerHTML='<div class="grid"><div class="card"><div class="label">Application Code</div><div class="value">'+esc(account.application_code)+'</div></div><div class="card"><div class="label">Permanent User ID</div><div class="value small">'+esc(account.user_id)+'</div></div><div class="card"><div class="label">Email</div><div class="value">'+esc(account.email)+'</div></div>'+examBlock+'</div><div class="status '+cls+'"><h2>'+heading+'</h2><p class="muted">'+text+'</p><div class="actions">'+(account.account_status==='approved'&&account.exam_status!=='passed'?'<a class="btn primary" href="https://pages-game-api-online.onrender.com/job/exam.html">Continue to Exam</a>':'')+'<a class="btn" href="https://game-api.online/dashboard.html">Developer Dashboard</a></div></div>'}init();$('logout').onclick=async()=>{await supabase.auth.signOut();location.replace('/login.html')};</script></body></html>
