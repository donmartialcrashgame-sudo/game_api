<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>Job Dashboard • Game API</title><style>body{margin:0;background:#050811;color:#f8fafc;font-family:Inter,system-ui,Arial}.wrap{width:min(950px,92%);margin:40px auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.muted{color:#91a0b5}.card{margin-top:20px;padding:25px;background:#0b1220;border:1px solid #ffffff14;border-radius:20px}.q{padding:20px;border:1px solid #ffffff12;border-radius:15px;margin:14px 0;background:#ffffff04}.option{display:block;padding:11px;margin-top:8px;background:#060b14;border:1px solid #ffffff12;border-radius:10px;cursor:pointer}.option input{margin-right:8px}.btn{padding:13px 17px;border:0;border-radius:11px;background:#4f8cff;color:#fff;font-weight:900;cursor:pointer}.danger{background:#ffffff0a}.result{font-size:28px;font-weight:950}.good{color:#70e0bd}.bad{color:#ff9b9b}</style></head><body><main class="wrap"><div class="top"><div><div class="muted">GAME API • JOB DASHBOARD</div><h1 id="hello">Welcome</h1><div class="muted" id="role"></div></div><button class="btn danger" id="logout">Sign out</button></div><section class="card"><h2>Skills assessment</h2><p class="muted">Your exam is selected from the skills and job role on your application. A score of 70% or higher is required to pass.</p><div id="exam">Loading exam…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB='https://qbagxeqquskkjksoraiz.supabase.co',KEY='sb_publishable_chfRxHSFPSA1SZJtBajtKA_I7vs8R--',sb=supabase.createClient(SB,KEY),EXAM=SB+'/functions/v1/job-exam';let questions=[];async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='/job/login.html';return}const {data:ju}=await sb.from('job_users').select('full_name,job_title,status').eq('id',user.id).maybeSingle();if(!ju||ju.status!=='active'){await sb.auth.signOut();location.href='/job/login.html';return}document.getElementById('hello').textContent='Welcome, '+ju.full_name;document.getElementById('role').textContent=ju.job_title;const session=await sb.auth.getSession();const r=await fetch(EXAM,{method:'POST',headers:{'Authorization':'Bearer '+session.data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({mode:'questions'})});const d=await r.json();if(!r.ok){document.getElementById('exam').innerHTML='<p class="bad">'+d.error+'</p>';return}questions=d.questions||[];if(!questions.length){document.getElementById('exam').innerHTML='<p class="muted">Your exam questions are being prepared by the review team. Please return later.</p>';return}document.getElementById('exam').innerHTML=`<form id="examForm">${questions.map((q,i)=>`<div class="q"><strong>${i+1}. ${q.question}</strong>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${q.id}" value="${j}" required> ${o}</label>`).join('')}</div>`).join('')}<button class="btn" type="submit">Submit Exam</button></form>`;document.getElementById('examForm').onsubmit=submitExam}async function submitExam(e){e.preventDefault();if(!confirm('Submit your exam now?'))return;const answers=questions.map(q=>({question_id:q.id,selected_option:Number(document.querySelector(`input[name=q${q.id}]:checked`).value)}));const session=await sb.auth.getSession();const r=await fetch(EXAM,{method:'POST',headers:{'Authorization':'Bearer '+session.data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({mode:'submit',answers})});const d=await r.json();if(!r.ok){alert(d.error||'Submission failed.');return}document.getElementById('exam').innerHTML=`<div class="result ${d.passed?'good':'bad'}">${d.passed?'✓ Exam passed':'Exam not passed'}</div><p class="muted">Your score: <strong>${d.score}%</strong></p><p class="muted">${d.passed?'Your application has moved to the next stage.':'Your current result has been recorded. The recruitment team will provide the next step.'}</p>`}document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='/job/login.html'};init();</script></body></html>
