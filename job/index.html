<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>Job Application Portal • Game API</title><style>body{margin:0;background:#050811;color:#f8fafc;font-family:Inter,system-ui,Arial}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(560px,100%);background:#0b1220;border:1px solid #ffffff14;border-radius:25px;padding:34px;box-shadow:0 30px 100px #0009}h1{font-size:42px;letter-spacing:-2px;margin:8px 0}p{color:#91a0b5;line-height:1.7}.hint{font-size:11px;color:#75a6ff;font-weight:900;letter-spacing:1px}.row{display:flex;gap:10px;margin-top:22px}input{flex:1;background:#060b14;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:15px;outline:none}.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:900;cursor:pointer;background:#4f8cff;color:#fff}.secondary{display:inline-block;margin-top:14px;color:#91a0b5;font-size:12px}.status{margin-top:20px;padding:20px;border-radius:16px;background:#ffffff06;border:1px solid #ffffff12}.status h2{margin:0 0 8px}.error{color:#ff9b9b}.ok{color:#78e5c5}.warn{color:#ffd27a}.errors{margin:12px 0;padding-left:20px;color:#ffb1b1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.linkbtn{display:inline-block;padding:12px 15px;border-radius:10px;background:#ffffff0a;color:#fff;text-decoration:none;font-weight:800;font-size:12px}.primary{background:#4f8cff}</style></head><body><main class="wrap"><section class="card"><div class="hint">GAME API • CAREERS</div><h1>Job Application Portal</h1><p>Enter your application code to check your document review. Your code is provided immediately after you apply.</p><div class="row"><input id="code" placeholder="GA-XXXXXXXXXX" autocomplete="off"><button class="btn" id="check">Check</button></div><div id="status"></div><a class="secondary" href="/apply.html">Need to apply for a job? Apply here →</a></section></main><script>const API='https://qbagxeqquskkjksoraiz.supabase.co/functions/v1/job-application';const input=document.getElementById('code'),box=document.getElementById('status');function render(a){let s=a.review_status;if(s==='approved'){box.innerHTML=`<div class="status"><h2 class="ok">✓ Document review successful</h2><p>Congratulations, ${a.full_name}. Your application for <strong>${a.job_title}</strong> has passed document review.</p><div class="actions"><a class="linkbtn primary" href="/job/dashboard.html">Move to the Dashboard</a></div></div>`}else if(s==='declined'){const errors=Array.isArray(a.review_errors)?a.review_errors:[];box.innerHTML=`<div class="status"><h2 class="error">Document review declined</h2><p>Please correct the issues below and submit your application again.</p>${errors.length?`<ul class="errors">${errors.map(x=>`<li>${String(x)}</li>`).join('')}</ul>`:'<p class="error">The review team requested corrections. Please re-apply with updated documents.</p>'}<div class="actions"><a class="linkbtn primary" href="/apply.html?reapply=${encodeURIComponent(a.application_code)}">Re-apply</a></div></div>`}else{box.innerHTML=`<div class="status"><h2 class="warn">Document review pending</h2><p>Your documents are still being reviewed. You cannot enter the job dashboard until the review is successful.</p><p>Check again later using the same application code.</p></div>`}}async function check(){const code=input.value.trim().toUpperCase();if(!code){box.innerHTML='<div class="status"><p class="error">Enter your application code.</p></div>';return}box.innerHTML='<div class="status"><p>Checking your application…</p></div>';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'check',application_code:code})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Application not found.');render(d.application)}catch(e){box.innerHTML=`<div class="status"><p class="error">${e.message}</p></div>`}}document.getElementById('check').onclick=check;input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});const q=new URLSearchParams(location.search).get('code');if(q){input.value=q;check()}</script></body></html>
