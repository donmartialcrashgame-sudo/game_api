<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>Job User Sign In • Game API</title><style>body{margin:0;background:#050811;color:#f8fafc;font-family:Inter,system-ui,Arial}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(450px,100%);padding:32px;background:#0b1220;border:1px solid #ffffff14;border-radius:24px}h1{font-size:38px;letter-spacing:-2px;margin:8px 0}.muted{color:#91a0b5;line-height:1.7}label{display:block;font-size:12px;font-weight:800;margin:15px 0 7px}input{width:100%;box-sizing:border-box;background:#060b14;color:#fff;border:1px solid #ffffff18;border-radius:11px;padding:13px}.btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#4f8cff;color:#fff;font-weight:900;cursor:pointer}.msg{margin-top:14px;color:#ff9b9b}</style></head><body><main class="wrap"><section class="card"><div class="muted">GAME API • JOB USER</div><h1>Sign in</h1><p class="muted">Only applicants who passed document review can have a job account.</p><form id="form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn">Sign in to Job Dashboard</button></form><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://qbagxeqquskkjksoraiz.supabase.co','sb_publishable_chfRxHSFPSA1SZJtBajtKA_I7vs8R--');document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg.textContent=error.message;return}location.href='/job/dashboard.html'};</script></body></html>
