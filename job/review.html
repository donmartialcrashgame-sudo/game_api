<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>Application Review • Game API</title><style>body{margin:0;background:#050811;color:#f8fafc;font-family:Inter,system-ui,Arial}.wrap{width:min(700px,92%);margin:55px auto}.card{background:#0b1220;border:1px solid #ffffff14;border-radius:24px;padding:32px}h1{margin:8px 0;font-size:40px;letter-spacing:-2px}.muted{color:#91a0b5;line-height:1.7}.panel{margin-top:20px;padding:20px;border:1px solid #ffffff12;border-radius:16px;background:#ffffff05}.ok{color:#70e0bd}.warn{color:#ffd27a}.bad{color:#ff9b9b}.btn{display:inline-block;margin-top:14px;padding:13px 17px;border-radius:11px;background:#4f8cff;color:#fff;text-decoration:none;font-weight:900;border:0;cursor:pointer}</style></head><body><main class="wrap"><section class="card"><div class="muted">GAME API • DOCUMENT REVIEW</div><h1>Application review</h1><p class="muted">This page shows the current review decision for your application.</p><div id="box" class="panel">Loading…</div></section></main><script>const API='https://qbagxeqquskkjksoraiz.supabase.co/functions/v1/job-application';const box=document.getElementById('box');const code=new URLSearchParams(location.search).get('code')||'';async function load(){try{if(!code)throw Error('No application code was supplied.');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'check',application_code:code})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to find application.');const a=d.application;if(a.review_status==='approved'){box.innerHTML=`<h2 class="ok">✓ Successful</h2><p class="muted">Your documents have passed review. Your job account can now be created.</p><button class="btn" onclick="account()">Create Job Account</button>`}else if(a.review_status==='declined'){box.innerHTML=`<h2 class="bad">Review declined</h2><p class="muted">Please correct the issues below and submit your application again.</p><ul class="bad">${(a.review_errors||[]).map(x=>`<li>${x}</li>`).join('')}</ul><a class="btn" href="/apply.html?reapply=${encodeURIComponent(a.application_code)}">Re-apply</a>`}else{box.innerHTML='<h2 class="warn">⏳ Pending review</h2><p class="muted">The review team has not completed your document review yet. The job dashboard is locked until approval.</p><a class="btn" href="/job/index.html">Check again later</a>'}}catch(e){box.innerHTML=`<p class="bad">${e.message}</p>`}}async function account(){const email=prompt('Enter the email used on your application:');if(!email)return;const password=prompt('Create a password (minimum 8 characters):');if(!password)return;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'create_account',application_code:code,email,password})});const d=await r.json();if(!r.ok){alert(d.error||'Unable to create account.');return}alert(d.message);location.href='/job/login.html'}load();</script></body></html>
