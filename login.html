<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gaming API — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.wrap{width:100%;max-width:440px}.brand{text-align:center;margin-bottom:22px}.logo{width:54px;height:54px;display:grid;place-items:center;margin:auto auto 12px;border-radius:16px;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:900;font-size:23px}.brand h1{font-size:24px;margin:0}.brand p{color:#8b98ad;font-size:12px}.card{background:#0d1422;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:28px;box-shadow:0 30px 80px #0006}label{display:block;color:#cbd5e1;font-size:11px;font-weight:700;margin:0 0 7px}.field{margin-bottom:15px}input{width:100%;padding:13px 14px;background:#ffffff09;color:#fff;border:1px solid #ffffff17;border-radius:9px;outline:0;font-size:13px}input:focus{border-color:#4f8cff}.primary{width:100%;padding:13px;border:0;border-radius:9px;background:linear-gradient(135deg,#4f8cff,#2563eb);color:#fff;font-weight:700;cursor:pointer}.primary:disabled,.oauth button:disabled{opacity:.55;cursor:not-allowed}.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#536075;font-size:10px;text-transform:uppercase}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#ffffff17}.oauth{display:grid;grid-template-columns:1fr 1fr;gap:10px}.oauth button,.secondary{padding:12px;border:1px solid #ffffff17;border-radius:9px;background:#ffffff09;color:#fff;cursor:pointer}.switch{text-align:center;color:#8b98ad;font-size:11px;margin-top:20px}.switch button{border:0;background:transparent;color:#75a6ff;cursor:pointer;font-weight:700}.msg{display:none;padding:12px;margin-top:15px;border-radius:9px;font-size:11px;line-height:1.5;white-space:pre-line}.error{display:block;background:#ff5c7014;color:#ff9aaa}.success{display:block;background:#20c99714;color:#67e2bb}.otp{display:none;margin-top:18px;padding-top:18px;border-top:1px solid #ffffff17}.otp.active{display:block}.otp input{text-align:center;font-size:20px;letter-spacing:7px}.secondary{width:100%;margin-top:8px}.footer{text-align:center;color:#4e5a6d;font-size:10px;margin-top:18px}@media(max-width:480px){.oauth{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body><div class="wrap"><div class="brand"><div class="logo">G</div><h1>Gaming API</h1><p>Secure Developer Platform</p></div><div class="card"><h2 id="title">Welcome back</h2><p id="desc" style="color:#8b98ad;font-size:12px;line-height:1.6">Sign in to access your Gaming API developer dashboard.</p><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password"></div><button class="primary" id="emailBtn">Sign In</button><div class="otp" id="otpBox"><label>Email verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button class="primary" id="verifyOtp">Verify Email</button><button class="secondary" id="resendOtp">Resend verification code</button></div><div class="divider">or continue with</div><div class="oauth"><button id="github">GitHub</button><button id="google">Google</button></div><div id="msg" class="msg"></div><div class="switch"><span id="switchText">Don't have an account?</span> <button id="switch">Create account</button></div></div><div class="footer">Gaming API · Secure Authentication</div></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://qbagxeqquskkjksoraiz.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiYWd4ZXFxdXNra2prc29yYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0.CpvwORFZrDtM5TVzqUlkHyc39E4jofCebQ16Ne-wShk');
const PROD='https://game-api.online/callback.html';let signup=false,lastEmail='';const $=id=>document.getElementById(id);function msg(t,c='error'){$('msg').className='msg '+c;$('msg').textContent=t}function clear(){ $('msg').className='msg';$('msg').textContent=''}
$('switch').onclick=()=>{signup=!signup;clear();$('title').textContent=signup?'Create your account':'Welcome back';$('desc').textContent=signup?'Create a secure Gaming API developer account.':'Sign in to access your Gaming API developer dashboard.';$('emailBtn').textContent=signup?'Create Account':'Sign In';$('switchText').textContent=signup?'Already have an account?':"Don't have an account?";$('switch').textContent=signup?'Sign in':'Create account'};
$('emailBtn').onclick=async()=>{clear();const e=$('email').value.trim(),p=$('password').value;if(!e||!p)return msg('Enter your email and password.');$('emailBtn').disabled=true;try{if(signup){const{data,error}=await supabase.auth.signUp({email:e,password:p,emailRedirectTo:PROD});if(error)throw error;lastEmail=e;if(!data.session){msg('Account created. Check your email and verify your address before signing in.','success')}else location.replace(PROD)}else{const{data,error}=await supabase.auth.signInWithPassword({email:e,password:p});if(error)throw error;if(!data.session)throw Error('No authenticated session was created.');location.replace(PROD)}}catch(err){msg(err.message||'Authentication failed.')}finally{$('emailBtn').disabled=false;$('emailBtn').textContent=signup?'Create Account':'Sign In'}};
async function oauth(provider,button){clear();button.disabled=true;try{const{error}=await supabase.auth.signInWithOAuth({provider,options:{redirectTo:PROD}});if(error)throw error}catch(err){msg(err.message||'OAuth failed.');button.disabled=false}}$('github').onclick=()=>oauth('github',$('github'));$('google').onclick=()=>oauth('google',$('google'));
async function sendOtp(){clear();const e=$('email').value.trim();if(!e)return msg('Enter your email address first.');$('resendOtp').disabled=true;try{const{error}=await supabase.auth.signInWithOtp({email:e,options:{shouldCreateUser:false,emailRedirectTo:PROD}});if(error)throw error;lastEmail=e;$('otpBox').classList.add('active');msg('A verification code has been sent to your email.','success');$('otp').focus()}catch(err){msg(err.message||'Could not send code.')}finally{$('resendOtp').disabled=false}}$('resendOtp').onclick=sendOtp;
$('verifyOtp').onclick=async()=>{const code=$('otp').value.trim();if(!lastEmail)return msg('Enter your email first.');if(!/^\d{6}$/.test(code))return msg('Enter the six-digit code.');$('verifyOtp').disabled=true;try{const{data,error}=await supabase.auth.verifyOtp({email:lastEmail,token:code,type:'email'});if(error)throw error;if(!data.session)throw Error('Verification succeeded but no session was created.');location.replace(PROD)}catch(err){msg(err.message||'Verification failed.')}finally{$('verifyOtp').disabled=false}};
</script></body></html>
