<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gaming API — Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070b14;
      --card: #0d1422;
      --border: rgba(255,255,255,.09);
      --text: #f8fafc;
      --muted: #8b98ad;
      --blue: #4f8cff;
      --blue2: #2563eb;
      --green: #20c997;
      --red: #ff5c70;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(79,140,255,.14),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(124,58,237,.10),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 54px;
      height: 54px;

      display: grid;
      place-items: center;

      margin: 0 auto 13px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          #7c3aed
        );

      font-size: 23px;
      font-weight: 900;

      box-shadow:
        0 12px 35px
        rgba(79,140,255,.25);
    }

    .brand h1 {
      font-size: 24px;
      letter-spacing: .5px;
    }

    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .card {
      background: rgba(13,20,34,.94);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 28px;

      box-shadow:
        0 30px 80px
        rgba(0,0,0,.38);

      backdrop-filter: blur(18px);
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .card-description {
      color: var(--muted);

      font-size: 12px;

      line-height: 1.6;

      margin-bottom: 23px;
    }

    label {
      display: block;

      color: #cbd5e1;

      font-size: 11px;

      font-weight: 700;

      margin-bottom: 7px;
    }

    .field {
      margin-bottom: 15px;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      background: rgba(255,255,255,.035);

      color: var(--text);

      border: 1px solid var(--border);

      border-radius: 9px;

      outline: none;

      font-size: 13px;

      transition: .2s;
    }

    input:focus {
      border-color:
        rgba(79,140,255,.65);

      box-shadow:
        0 0 0 3px
        rgba(79,140,255,.09);
    }

    input::placeholder {
      color: #58657a;
    }

    .primary {
      width: 100%;

      padding: 13px;

      border: 0;

      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue2)
        );

      color: white;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      transition: .2s;

      margin-top: 4px;
    }

    .primary:hover {
      transform: translateY(-1px);

      box-shadow:
        0 10px 25px
        rgba(37,99,235,.22);
    }

    .primary:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      margin: 22px 0;

      color: #536075;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      flex: 1;

      background: var(--border);
    }

    .oauth {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .oauth button {
      padding: 12px 10px;

      border: 1px solid var(--border);

      border-radius: 9px;

      background: rgba(255,255,255,.035);

      color: var(--text);

      cursor: pointer;

      font-size: 12px;

      font-weight: 600;

      transition: .2s;
    }

    .oauth button:hover {
      background: rgba(255,255,255,.07);

      border-color:
        rgba(255,255,255,.16);
    }

    .oauth button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .oauth-icon {
      margin-right: 6px;
      font-weight: 900;
    }

    .switch {
      text-align: center;

      color: var(--muted);

      font-size: 11px;

      margin-top: 22px;
    }

    .switch button {
      border: 0;

      background: transparent;

      color: #75a6ff;

      cursor: pointer;

      font-size: 11px;

      font-weight: 700;
    }

    .message {
      display: none;

      padding: 12px;

      margin-top: 15px;

      border-radius: 9px;

      font-size: 11px;

      line-height: 1.5;

      white-space: pre-line;
    }

    .error {
      display: block;

      background:
        rgba(255,92,112,.08);

      color: #ff9aaa;

      border:
        1px solid
        rgba(255,92,112,.15);
    }

    .success {
      display: block;

      background:
        rgba(32,201,151,.08);

      color: #67e2bb;

      border:
        1px solid
        rgba(32,201,151,.15);
    }

    .otp-box {
      display: none;

      margin-top: 18px;

      padding-top: 18px;

      border-top:
        1px solid var(--border);
    }

    .otp-box.active {
      display: block;
    }

    .otp-input {
      text-align: center;

      font-size: 20px;

      letter-spacing: 7px;
    }

    .small-button {
      width: 100%;

      padding: 11px;

      margin-top: 8px;

      border:
        1px solid var(--border);

      border-radius: 8px;

      background:
        rgba(255,255,255,.035);

      color: #cbd5e1;

      cursor: pointer;

      font-size: 11px;
    }

    .small-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;

      color: #4e5a6d;

      font-size: 10px;

      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 22px;
      }

      .oauth {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="wrapper">

  <div class="brand">

    <div class="logo">
      G
    </div>

    <h1>
      Gaming API
    </h1>

    <p>
      Secure Developer Platform
    </p>

  </div>


  <div class="card">

    <div
      class="card-title"
      id="formTitle">

      Welcome back

    </div>


    <div
      class="card-description"
      id="formDescription">

      Sign in to access your Gaming API
      developer dashboard.

    </div>


    <!-- EMAIL -->

    <div class="field">

      <label for="email">
        Email address
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
      >

    </div>


    <!-- PASSWORD -->

    <div class="field">

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
      >

    </div>


    <button
      class="primary"
      id="emailButton">

      Sign In

    </button>


    <!-- OTP -->

    <div
      class="otp-box"
      id="otpBox">

      <label for="otp">
        Email verification code
      </label>

      <input
        id="otp"
        class="otp-input"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="000000"
      >

      <button
        class="primary"
        id="verifyOtp">

        Verify Email

      </button>

      <button
        class="small-button"
        id="resendOtp">

        Resend verification code

      </button>

    </div>


    <div class="divider">
      or continue with
    </div>


    <!-- OAUTH -->

    <div class="oauth">

      <button id="githubButton">

        <span class="oauth-icon">
          GitHub
        </span>

        GitHub

      </button>


      <button id="googleButton">

        <span class="oauth-icon">
          G
        </span>

        Google

      </button>

    </div>


    <div
      id="message"
      class="message">
    </div>


    <div class="switch">

      <span id="switchText">
        Don't have an account?
      </span>

      <button id="switchMode">
        Create account
      </button>

    </div>

  </div>


  <div class="footer">
    Gaming API · Secure Authentication
  </div>

</div>


<script type="module">

  import {
    createClient
  } from
  "https://esm.sh/@supabase/supabase-js@2";


  /* ==========================================
     SUPABASE
     ========================================== */

  const SUPABASE_URL =
    "https://qbagxeqquskkjksoraiz.supabase.co";


  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiYWd4ZXFxdXNra2prc29yYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0.CpvwORFZrDtM5TVzqUlkHyc39E4jofCebQ16Ne-wShk";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==========================================
     LOCAL CALLBACK URL
     ========================================== */

  const CALLBACK_URL =
    "http://127.0.0.1:5500/callback.html";


  /* ==========================================
     ELEMENTS
     ========================================== */

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const emailButton =
    document.getElementById("emailButton");

  const githubButton =
    document.getElementById("githubButton");

  const googleButton =
    document.getElementById("googleButton");

  const switchMode =
    document.getElementById("switchMode");

  const switchText =
    document.getElementById("switchText");

  const formTitle =
    document.getElementById("formTitle");

  const formDescription =
    document.getElementById("formDescription");

  const message =
    document.getElementById("message");

  const otpBox =
    document.getElementById("otpBox");

  const otp =
    document.getElementById("otp");

  const verifyOtp =
    document.getElementById("verifyOtp");

  const resendOtp =
    document.getElementById("resendOtp");


  let signupMode = false;

  let lastEmail = "";


  /* ==========================================
     MESSAGE
     ========================================== */

  function showMessage(
    text,
    type = "error"
  ) {

    message.className =
      "message " + type;

    message.textContent =
      text;

  }


  function clearMessage() {

    message.className =
      "message";

    message.textContent =
      "";

  }


  /* ==========================================
     LOGIN / SIGNUP SWITCH
     ========================================== */

  switchMode.addEventListener(
    "click",
    () => {

      signupMode =
        !signupMode;

      clearMessage();

      otpBox.classList.remove(
        "active"
      );


      if (signupMode) {

        formTitle.textContent =
          "Create your account";

        formDescription.textContent =
          "Create a secure account for the Gaming API developer platform.";

        emailButton.textContent =
          "Create Account";

        switchText.textContent =
          "Already have an account?";

        switchMode.textContent =
          "Sign in";

      } else {

        formTitle.textContent =
          "Welcome back";

        formDescription.textContent =
          "Sign in to access your Gaming API developer dashboard.";

        emailButton.textContent =
          "Sign In";

        switchText.textContent =
          "Don't have an account?";

        switchMode.textContent =
          "Create account";

      }

    }
  );


  /* ==========================================
     EMAIL AUTH
     ========================================== */

  emailButton.addEventListener(
    "click",
    async () => {

      clearMessage();

      const emailValue =
        email.value.trim();

      const passwordValue =
        password.value;


      if (!emailValue) {

        showMessage(
          "Please enter your email address."
        );

        return;

      }


      if (!passwordValue) {

        showMessage(
          "Please enter your password."
        );

        return;

      }


      emailButton.disabled =
        true;

      emailButton.textContent =
        signupMode
          ? "Creating account..."
          : "Signing in...";


      try {

        if (signupMode) {

          const {
            data,
            error
          } =
          await supabase.auth.signUp({

            email:
              emailValue,

            password:
              passwordValue

          });


          if (error) {
            throw error;
          }


          lastEmail =
            emailValue;


          if (!data.session) {

            showMessage(
              "Account created successfully.\n\nCheck your email and verify your email address before signing in.",
              "success"
            );

          } else {

            window.location.replace(
              CALLBACK_URL
            );

          }

        } else {

          const {
            data,
            error
          } =
          await supabase.auth.signInWithPassword({

            email:
              emailValue,

            password:
              passwordValue

          });


          if (error) {
            throw error;
          }


          if (!data.session) {

            throw new Error(
              "No authenticated session was created."
            );

          }


          /*
           * IMPORTANT:
           *
           * We don't send the user directly
           * to dashboard.html.
           *
           * callback.html checks the
           * authentication/MFA state.
           */

          window.location.replace(
            CALLBACK_URL
          );

        }

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Authentication failed."
        );

      } finally {

        emailButton.disabled =
          false;

        emailButton.textContent =
          signupMode
            ? "Create Account"
            : "Sign In";

      }

    }
  );


  /* ==========================================
     GOOGLE
     ========================================== */

  googleButton.addEventListener(
    "click",
    async () => {

      clearMessage();

      googleButton.disabled =
        true;

      googleButton.textContent =
        "Connecting...";


      try {

        const {
          error
        } =
        await supabase.auth.signInWithOAuth({

          provider:
            "google",

          options: {

            redirectTo:
              CALLBACK_URL

          }

        });


        if (error) {
          throw error;
        }

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Google authentication failed."
        );


        googleButton.disabled =
          false;

        googleButton.innerHTML =
          '<span class="oauth-icon">G</span> Google';

      }

    }
  );


  /* ==========================================
     GITHUB
     ========================================== */

  githubButton.addEventListener(
    "click",
    async () => {

      clearMessage();

      githubButton.disabled =
        true;

      githubButton.textContent =
        "Connecting...";


      try {

        const {
          error
        } =
        await supabase.auth.signInWithOAuth({

          provider:
            "github",

          options: {

            redirectTo:
              CALLBACK_URL

          }

        });


        if (error) {
          throw error;
        }

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "GitHub authentication failed."
        );


        githubButton.disabled =
          false;

        githubButton.innerHTML =
          '<span class="oauth-icon">GitHub</span> GitHub';

      }

    }
  );


  /* ==========================================
     SEND OTP
     ========================================== */

  async function sendOtp() {

    clearMessage();

    const emailValue =
      email.value.trim();


    if (!emailValue) {

      showMessage(
        "Enter your email address first."
      );

      return;

    }


    resendOtp.disabled =
      true;

    resendOtp.textContent =
      "Sending...";


    try {

      const {
        error
      } =
      await supabase.auth.signInWithOtp({

        email:
          emailValue,

        options: {

          shouldCreateUser:
            false

        }

      });


      if (error) {
        throw error;
      }


      lastEmail =
        emailValue;


      otpBox.classList.add(
        "active"
      );


      showMessage(
        "A verification code has been sent to your email.",
        "success"
      );


      otp.focus();

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Unable to send verification code."
      );

    } finally {

      resendOtp.disabled =
        false;

      resendOtp.textContent =
        "Resend verification code";

    }

  }


  /* ==========================================
     VERIFY OTP
     ========================================== */

  verifyOtp.addEventListener(
    "click",
    async () => {

      const code =
        otp.value.trim();


      if (!lastEmail) {

        showMessage(
          "Enter your email address first."
        );

        return;

      }


      if (!/^\d{6}$/.test(code)) {

        showMessage(
          "Enter the six-digit verification code."
        );

        return;

      }


      verifyOtp.disabled =
        true;

      verifyOtp.textContent =
        "Verifying...";


      try {

        const {
          data,
          error
        } =
        await supabase.auth.verifyOtp({

          email:
            lastEmail,

          token:
            code,

          type:
            "email"

        });


        if (error) {
          throw error;
        }


        if (!data.session) {

          throw new Error(
            "Verification succeeded but no session was created."
          );

        }


        window.location.replace(
          CALLBACK_URL
        );

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "OTP verification failed."
        );

      } finally {

        verifyOtp.disabled =
          false;

        verifyOtp.textContent =
          "Verify Email";

      }

    }
  );


  /* ==========================================
     RESEND OTP
     ========================================== */

  resendOtp.addEventListener(
    "click",
    sendOtp
  );


</script>

</body>
</html>
