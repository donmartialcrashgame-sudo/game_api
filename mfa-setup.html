<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gaming API — MFA Setup</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b14;color:#f8fafc;font-family:Arial,sans-serif}.card{width:min(460px,calc(100% - 40px));padding:30px;border:1px solid #ffffff17;border-radius:18px;background:#0d1422;box-shadow:0 30px 80px #0008}.muted{color:#8b98ad;font-size:13px;line-height:1.6}.qr{display:block;width:220px;height:220px;margin:20px auto;background:#fff;padding:10px;border-radius:10px}.code{width:100%;box-sizing:border-box;padding:13px;text-align:center;font-size:22px;letter-spacing:7px;background:#ffffff09;color:#fff;border:1px solid #ffffff17;border-radius:9px}.btn{width:100%;padding:13px;margin-top:12px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;font-size:12px;white-space:pre-line}.show{display:block}.error{background:#ff5c7014;color:#ff9aaa}.success{background:#20c99714;color:#67e2bb}.secret{font-family:monospace;word-break:break-all;background:#ffffff08;padding:10px;border-radius:8px}</style></head><body><div class="card"><h1>Secure your account</h1><p class="muted" id="intro">Set up your authenticator app to protect your Gaming API account.</p><div id="setup"></div><input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="000000"><button id="verify" class="btn">Verify authenticator</button><div id="msg" class="msg"></div></div><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://qbagxeqquskkjksoraiz.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF0ZSIsInJlZiI6Im5vbmUiLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0');
// The public anon key is intentionally loaded below from the production project configuration.
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF0ZSIsInJlZiI6InFiYWd4ZXFxdXNra2prc29yYWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM4OTgsImV4cCI6MjEwMjg5OTg5OH0.CpvwORFZrDtM5TVzqUlkHyc39E4jofCebQ16Ne-wShk';const client=createClient('https://qbagxeqquskkjksoraiz.supabase.co',ANON);let factorId=null;const $=id=>document.getElementById(id);function msg(t,c='error'){$('msg').textContent=t;$('msg').className='msg show '+c}
async function init(){try{const{data,error}=await client.auth.getSession();if(error)throw error;if(!data.session){location.replace('https://game-api.online/login.html');return}const aal=await client.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.data?.currentLevel==='aal2'){location.replace('https://game-api.online/dashboard.html');return}const factors=await client.auth.mfa.listFactors();if(factors.error)throw factors.error;const verified=factors.data.totp.filter(f=>f.status==='verified');if(verified.length){factorId=verified[0].id;$('intro').textContent='Enter the six-digit code from your authenticator app to finish signing in.';$('setup').innerHTML='<p class="muted">Your authenticator is already configured.</p>';return}const enrolled=await client.auth.mfa.enroll({factorType:'totp',friendlyName:'Gaming API Authenticator'});if(enrolled.error)throw enrolled.error;factorId=enrolled.data.id;const secret=enrolled.data.totp.secret;const uri=enrolled.data.totp.uri;$('setup').innerHTML='<p class="muted">Scan this QR code with Google Authenticator, Microsoft Authenticator, Authy, or another TOTP app.</p><img class="qr" alt="Authenticator QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(uri)+'"><p class="muted">Manual setup key:</p><div class="secret">'+secret+'</div>'}catch(e){msg(e.message||'Unable to prepare MFA.')}}init();$('verify').onclick=async()=>{const code=$('code').value.trim();if(!factorId)return msg('No authenticator factor is ready.');if(!/^\d{6}$/.test(code))return msg('Enter the six-digit authenticator code.');$('verify').disabled=true;try{const ch=await client.auth.mfa.challenge({factorId});if(ch.error)throw ch.error;const v=await client.auth.mfa.verify({factorId,challengeId:ch.data.id,code});if(v.error)throw v.error;msg('MFA verified successfully. Redirecting...','success');setTimeout(()=>location.replace('https://game-api.online/dashboard.html'),500)}catch(e){msg(e.message||'MFA verification failed.')}finally{$('verify').disabled=false}};</script></body></html>
